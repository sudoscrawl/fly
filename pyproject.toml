[project]
name = "flyt"
version = "0.2.0"
description = "Your project's second memory"
readme = "README.md"
authors = [
    { name = "Ayush Kumar", email = "ayush438500@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pendulum>=3.2.0",
    "typer>=0.27.0",
]

[project.scripts]
fly = "fly.main:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fly"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
