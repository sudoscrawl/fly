name: Publish on PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build --no-sources

      - name: Publish
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{secrets.PYPI_TOKEN}}
